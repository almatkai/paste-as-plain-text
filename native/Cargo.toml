[package]
name = "tezbar-paste-as-plain-text-process"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT AND Apache-2.0"
description = "Standalone Tezbar process extension: paste clipboard content in seven formats"
repository = "https://github.com/almatkai/paste-as-plain-text"
publish = false

[[bin]]
name = "tezbar-paste-as-plain-text"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time", "process", "fs"] }
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "aaec571673ab64a85a136cf6bd054ef660c4d93c" }
tezbar-paste-as-plain-text = { path = "../v2" }

[dev-dependencies]
jsonschema = { version = "=0.29.1", default-features = false }
sha2 = "0.10"
tempfile = "3"

[lints.clippy]
all = "warn"
