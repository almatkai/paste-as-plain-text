[package]
name = "tezbar-paste-as-plain-text"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT AND Apache-2.0"
description = "Compiled-in Native V2 clipboard format command for Tezbar"
repository = "https://github.com/almatkai/paste-as-plain-text"
include = ["*.rs", "Cargo.toml", "Cargo.lock", "manifest.json", "README.md", "LICENSE*", "assets/**", "tests/**", "scripts/**", ".cargo/config.toml"]

[lib]
path = "lib.rs"

[dependencies]
async-trait = "0.1.89"
json5 = "=0.4.1"
regex = "1.12"
reqwest = { version = "=0.12.28", default-features = false, features = ["native-tls", "charset"] }
ryu-js = "1.0.2"
scraper = "=0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "sync", "time", "io-util"] }
url = "=2.5.4"

[dev-dependencies]
jsonschema = { version = "=0.29.1", default-features = false }
log = "0.4"
sha2 = "0.10"
tempfile = "3"

[lints.clippy]
all = "warn"
